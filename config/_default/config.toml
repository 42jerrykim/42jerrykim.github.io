# Change baseurl before deploy
baseurl = "https://42jerrykim.github.io/"
languageCode = "ko-kr"
title = "42JerryKim"

# Theme i18n support
# Available values: en, fr, id, ja, ko, pt-br, zh-cn, zh-tw, es, de, nl, it, th, el, uk, ar
defaultContentLanguage = "ko"

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage = true

# Change it to your Disqus shortname before using
disqusShortname = "hugo-theme-stack"

[pagination]
pagerSize = 10

[outputs]
home = ["HTML", "RSS"]
section = ["HTML"]
taxonomy = ["HTML"]
term = ["HTML"]

[imaging]
quality = 80
resampleFilter = "Box"

[imaging.exif]
disableDate = true
disableLatLong = true

[services.rss]
limit = 50

# GA4 웹 스트림 (속성 ID 378371944, 스트림 ID 5262841886)
# layouts/partials/head/head.html 이 _internal/google_analytics.html 을 호출한다
[services.googleAnalytics]
ID = "G-E99XGK8V2Y"

